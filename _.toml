[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-composer"
version = "0.1.0"
description = "Document Composer"
authors = [{ name = "Everton Jhons" }]
readme = "README.md"
requires-python = ">=3.10"

# dependencies = ["synaptic-units @ file:///../synaptic-units"]
[project.optional-dependencies]
dev = ["pydantic", "pytest", "jinja2>=3.1.2", "pyyaml>=6.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
