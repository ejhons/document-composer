[project]
name = "document-composer"
version = "0.1.0"
description = "Python-based document composition system designed to transform structured recipes, reusable document components, templates, data inputs, and external resources into final documents such as HTML, PDF, and DOCX."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ejhons", email = "ejhons.mail@gmail.com" }]
dependencies = ["dcp-engine", "dcp-application", "dcp-cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE*"]

[project.urls]
Homepage = "https://github.com/ejhons/document-composer"
Issues = "https://github.com/ejhons/document-composer/issues"

[dependency-groups]
# Dependência de dev (`pytest`, `ruff`, etc.) fica só na raiz e vale para todos.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "packaging>=24",
    "hatchling>=1.32.4",
]

[tool.uv]
# A raiz é só orquestração: não é construída nem instalada como pacote.
# evita que o uv tente construir o projeto raiz.
package = false

[tool.uv.workspace]
# aceita globs; novos pacotes em `packages/` entram automaticamente.
members = ["packages/*"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

# Sources na raiz valem para todos os membros (a menos que sobrescritos).
[tool.uv.sources]
dcp-engine = { workspace = true }
dcp-application = { workspace = true }
dcp-cli = { workspace = true }

[tool.pytest.ini.options]
testpaths = ["tests", "packages"] #"packages/*/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"


