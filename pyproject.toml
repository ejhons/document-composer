[project]
name = "document-composer"
version = "0.1.0"
description = "Python-based document composition system designed to transform structured **recipes**, reusable document components, templates, data inputs, and external resources into final documents such as **HTML, PDF, and DOCX**."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dcp-engine",
    "dcp-application",
    "dcp-cli",
    "dcp-api",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv.workspace]
members = [
    "packages/engine",
    "packages/api",
    "packages/cli",
    "packages/application",
]

[tool.uv.sources]
dcp-engine = { workspace = true }
dcp-application = { workspace = true }
dcp-cli = { workspace = true }
dcp-api = { workspace = true }
