[project]
name = "dcp-cli"
version = "0.1.0"
description = "Provides the command-line interface for building documents with **DocComposer**"
readme = "README.md"
authors = [{ name = "ejhons", email = "ejhons.mail@gmail.com" }]
requires-python = ">=3.11"

# Observe que `docz-core` e `docz-application` **não aparecem** em `dependencies`. 
# É isso que mantém o wheel da CLI instalável sem eles estarem no PyPI.
dependencies = [
    "typer>=0.27.2",
    "hatchling",
    "jinja2",
    "markdown",
    "networkx",
    "openpyxl",
    "pandas",
    "pydantic",
    "pypandoc",
    "pypdf",
    "pypdfium2",
    "python-docx",
    "pyyaml",
    "requests",
    "rich",
    "shortuuid",
    "tabulate",
    "xhtml2pdf",
]

#, "dcp-engine", "dcp-application"]
# dynamic = ["dependecies"]

[project.scripts]
dcp = "dcp_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcp_cli"]

# Hook que embute docz_core e docz_application no wheel
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

