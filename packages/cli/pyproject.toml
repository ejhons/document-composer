[project]
name = "dcp-cli"
version = "0.1.0"
description = "Provides the command-line interface for building documents with **DocComposer**"
readme = "README.md"
authors = [{ name = "ejhons", email = "ejhons.mail@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["typer>=0.27.2"]


[project.scripts]
dcp = "dcp_cli.cli:app"


[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"
